<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Progress Dashboard</title>
    <style>
      :root {
        --bg-color: #0f0f1a;
        --card-bg: #1a1a2e;
        --text-color: #e0e0f0;
        --subtext-color: #9090b0;
        --accent: #00e5ff;
        --accent2: #ff2d9d;
        --track-bg: #2a2a40;
        --input-bg: #22223a;
        --border-color: #33334d;
        --shadow-color: rgba(0, 229, 255, 0.4);
      }

      body.light {
        --bg-color: #f0f2f8;
        --card-bg: #ffffff;
        --text-color: #1a1a2e;
        --subtext-color: #55557a;
        --accent: #0077ff;
        --accent2: #e6007a;
        --track-bg: #e2e6f0;
        --input-bg: #eef0f8;
        --border-color: #d0d4e4;
        --shadow-color: rgba(0, 119, 255, 0.35);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        background: var(--bg-color);
        color: var(--text-color);
        min-height: 100vh;
        transition:
          background 0.4s ease,
          color 0.4s ease;
        padding: 30px 20px 60px;
      }

      .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        max-width: 1000px;
        margin: 0 auto 40px;
        flex-wrap: wrap;
        gap: 15px;
      }

      .top-bar h1 {
        font-size: 1.8rem;
        background: linear-gradient(90deg, var(--accent), var(--accent2));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        letter-spacing: 1px;
      }

      /* Theme Toggle Switch */
      .theme-toggle {
        position: relative;
        width: 60px;
        height: 30px;
        cursor: pointer;
      }

      .theme-toggle input {
        opacity: 0;
        width: 0;
        height: 0;
      }

      .slider {
        position: absolute;
        inset: 0;
        background: var(--track-bg);
        border-radius: 30px;
        transition: 0.4s;
        border: 1px solid var(--border-color);
        display: flex;
        align-items: center;
        padding: 0 6px;
        justify-content: space-between;
      }

      .slider::before {
        content: "";
        position: absolute;
        height: 22px;
        width: 22px;
        left: 3px;
        bottom: 3px;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        border-radius: 50%;
        transition: 0.4s;
        box-shadow: 0 0 10px var(--shadow-color);
        z-index: 2;
      }

      input:checked + .slider::before {
        transform: translateX(29px);
      }

      .slider .icon {
        font-size: 13px;
        z-index: 1;
        opacity: 0.8;
      }

      .container {
        max-width: 1000px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
        gap: 25px;
      }

      .card {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 18px;
        padding: 24px;
        transition:
          background 0.4s ease,
          border-color 0.4s ease,
          transform 0.25s ease;
        position: relative;
        overflow: hidden;
      }

      .card:hover {
        transform: translateY(-4px);
      }

      .card::before {
        content: "";
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: radial-gradient(
          circle,
          var(--shadow-color) 0%,
          transparent 60%
        );
        opacity: 0;
        transition: opacity 0.4s ease;
        pointer-events: none;
      }

      .card:hover::before {
        opacity: 0.15;
      }

      .card-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 16px;
      }

      .username {
        font-size: 1.25rem;
        font-weight: 600;
        letter-spacing: 0.5px;
      }

      .value-display {
        font-size: 0.95rem;
        color: var(--subtext-color);
        font-variant-numeric: tabular-nums;
      }

      .value-display .current {
        color: var(--accent);
        font-weight: 700;
        text-shadow: 0 0 8px var(--shadow-color);
      }

      /* Progress bar */
      .progress-track {
        width: 100%;
        height: 22px;
        background: var(--track-bg);
        border-radius: 20px;
        overflow: hidden;
        position: relative;
        border: 1px solid var(--border-color);
        margin-bottom: 10px;
      }

      .progress-fill {
        height: 100%;
        width: 0%;
        border-radius: 20px;
        background: linear-gradient(90deg, var(--accent), var(--accent2));
        position: relative;
        transition:
          width 0.8s cubic-bezier(0.22, 1, 0.36, 1),
          box-shadow 0.4s ease;
        box-shadow:
          0 0 10px var(--shadow-color),
          0 0 20px var(--shadow-color);
      }

      .progress-fill::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.35),
          transparent
        );
        animation: shimmer 2s infinite;
      }

      @keyframes shimmer {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(100%);
        }
      }

      .progress-fill.pulse {
        animation: pulseGlow 0.6s ease;
      }

      @keyframes pulseGlow {
        0% {
          box-shadow: 0 0 5px var(--shadow-color);
        }
        50% {
          box-shadow:
            0 0 25px var(--shadow-color),
            0 0 45px var(--shadow-color);
        }
        100% {
          box-shadow:
            0 0 10px var(--shadow-color),
            0 0 20px var(--shadow-color);
        }
      }

      .percent-label {
        font-size: 0.8rem;
        color: var(--subtext-color);
        text-align: right;
        margin-bottom: 18px;
      }

      .controls {
        display: flex;
        gap: 10px;
      }

      .controls input[type="number"] {
        flex: 1;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid var(--border-color);
        background: var(--input-bg);
        color: var(--text-color);
        font-size: 0.95rem;
        outline: none;
        transition:
          border-color 0.3s ease,
          box-shadow 0.3s ease;
      }

      .controls input[type="number"]:focus {
        border-color: var(--accent);
        box-shadow: 0 0 10px var(--shadow-color);
      }

      .controls button {
        padding: 10px 18px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(90deg, var(--accent), var(--accent2));
        color: #fff;
        font-weight: 600;
        cursor: pointer;
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
      }

      .controls button:hover {
        transform: scale(1.05);
        box-shadow: 0 0 15px var(--shadow-color);
      }

      .controls button:active {
        transform: scale(0.97);
      }

      footer {
        text-align: center;
        margin-top: 50px;
        color: var(--subtext-color);
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <div class="top-bar">
      <h1>⚡ Progress Dashboard</h1>
      <label class="theme-toggle">
        <input type="checkbox" id="themeSwitch" />
        <div class="slider">
          <span class="icon">🌙</span>
          <span class="icon">☀️</span>
        </div>
      </label>
    </div>

    <div class="container" id="cardContainer"></div>

    <footer>Max value for each bar: 13,500</footer>

    <script>
      const MAX_VALUE = 13500;
      const users = ["Rahat", "Mohian", "Minhaz", "Aqil", "Shopnil"];
      const userPoints = [2635, 1270, 60, 210, 0];
      const container = document.getElementById("cardContainer");

      users.forEach((user, index) => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
    <div class="card-header">
      <div class="username">${user}</div>
      <div class="value-display">
        <span class="current" id="current-${index}">0</span> / ${MAX_VALUE}
      </div>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="fill-${index}"></div>
    </div>
    <div class="percent-label" id="percent-${index}">0%</div>
    <div class="controls">
      <input type="number" id="input-${index}" min="0" max="${MAX_VALUE}" placeholder="Enter value (0 - ${MAX_VALUE})">
      <button onclick="updateProgress(${index})">Set</button>
    </div>
  `;
        container.appendChild(card);

        // Pre-fill the input with the static value
        document.getElementById(`input-${index}`).value = userPoints[index];
      });

      // Initialize all progress bars with userPoints AFTER all cards are in the DOM
      users.forEach((user, index) => {
        updateProgress(index);
      });

      function updateProgress(index) {
        const input = document.getElementById(`input-${index}`);
        let value = parseFloat(input.value);

        if (isNaN(value)) value = 0;
        value = Math.max(0, Math.min(MAX_VALUE, value));

        const percent = (value / MAX_VALUE) * 100;
        const fill = document.getElementById(`fill-${index}`);
        const current = document.getElementById(`current-${index}`);
        const percentLabel = document.getElementById(`percent-${index}`);

        fill.style.width = percent + "%";
        current.textContent = Math.round(value);
        percentLabel.textContent = percent.toFixed(1) + "%";

        fill.classList.remove("pulse");
        void fill.offsetWidth; // reflow to restart animation
        fill.classList.add("pulse");

        input.value = value;
      }

      // Allow pressing Enter to submit
      document.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && e.target.tagName === "INPUT") {
          const id = e.target.id;
          if (id.startsWith("input-")) {
            const index = id.split("-")[1];
            updateProgress(index);
          }
        }
      });

      // Theme toggle
      const themeSwitch = document.getElementById("themeSwitch");
      themeSwitch.addEventListener("change", () => {
        document.body.classList.toggle("light", themeSwitch.checked);
      });
    </script>
  </body>
</html>
